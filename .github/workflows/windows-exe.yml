name: Windows EXE

on:
  workflow_dispatch:
  pull_request:
    branches:
      - build/windows-exe-electron
    paths:
      - "package.json"
      - "vite.config.ts"
      - "electron/**"
      - "build/**"
      - "scripts/**"
      - "server/**"
      - "src/**"
      - ".github/workflows/windows-exe.yml"
  push:
    branches:
      - build/windows-exe-electron
      - fix/print-and-student-search
    paths:
      - "package.json"
      - "vite.config.ts"
      - "electron/**"
      - "build/**"
      - "scripts/**"
      - "server/**"
      - "src/**"
      - ".github/workflows/windows-exe.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist:win

      - name: Upload EXE installer
        uses: actions/upload-artifact@v4
        with:
          name: school-absence-windows-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
